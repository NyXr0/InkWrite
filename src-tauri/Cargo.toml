[package]
name = "inkwell"
version = "0.1.0"
description = "Local-first plain-text novel-writing studio"
authors = ["drxtr0men"]
edition = "2021"

[lib]
name = "inkwell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rusqlite = { version = "0.31", features = ["bundled", "bundled-full"] }
git2 = "0.19"
notify = "6.1"
pulldown-cmark = "0.11"
docx-rs = "0.4"
epub-builder = "0.7"
argon2 = "0.5"
chacha20poly1305 = "0.10"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
thiserror = "1.0"
tokio = { version = "1.39", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
